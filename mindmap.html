<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>大型章节思维导图 · 左图右览</title>
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./mindmap.css?v=53" />
</head>
<body>
  <header class="map-topbar">
    <div class="map-brand">
      <a class="back-link" href="./index.html">← 返回题库</a>
      <div>
        <p>方案 B · 左侧大型导图 + 右侧内容预览</p>
        <h1>章节思维导图导航</h1>
      </div>
    </div>
    <div class="map-top-actions">
      <button id="fitBtn" class="ghost">回到顶部</button>
      <button id="themeBtn" class="ghost">夜间</button>
    </div>
  </header>

  <section class="map-controls">
    <label><span>学科</span><select id="subjectSelect"></select></label>
    <label><span>大型导图</span><select id="mapSelect"></select></label>
    <label><span>机构来源</span><select id="sourceSelect"><option value="">全部机构</option></select></label>
    <label><span>内容类型</span><select id="typeSelect"><option value="">全部内容</option><option value="knowledge">知识点</option><option value="notes">课堂笔记</option><option value="questions">题目</option><option value="pdf">PDF资料</option></select></label>
    <label class="map-search"><span>搜索节点</span><input id="searchInput" placeholder="输入标题、知识点或关键词" /></label>
    <button id="expandBtn">展开全部</button>
    <button id="collapseBtn" class="ghost">收起全部</button>
  </section>

  <main class="map-workspace">
    <aside class="map-tree-panel">
      <div class="tree-panel-head">
        <div><b id="treeTitle">章节导图</b><span id="treeMeta"></span></div>
        <span class="legend"><i class="knowledge"></i>知识点 <i class="note"></i>笔记 <i class="question"></i>题目 <i class="pdf"></i>PDF</span>
      </div>
      <div id="mapTree" class="map-tree"></div>
    </aside>

    <section class="map-preview-panel" id="previewPanel">
      <div class="preview-empty">
        <span>思</span>
        <h2>点击左侧节点</h2>
        <p>右侧会显示对应知识点、课堂笔记、题目或文档标题的预览，再进入原卡片继续学习。</p>
      </div>
    </section>
  </main>

  <script src="./knowledge-data.js?v=53"></script>
  <script src="./mindmap-data.js?v=53"></script>
  <script src="./mindmap.js?v=53"></script>
</body>
</html>
